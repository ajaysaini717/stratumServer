services:
  asic-pool:
    # Use the image you pushed to Docker Hub
    image: ajaysaini717/bdag:v1.6.3
    container_name: asic-pool
    restart: unless-stopped
    ports:
      - "3334:3334"
    environment:
      # Stratum Server
      POOL_PORT: ${POOL_PORT:-3334}
      
      # Node RPC (DAG) - connects to devnet
      NODE_RPC_URL: ${NODE_RPC_URL}
      NODE_RPC_USER: ${NODE_RPC_USER}
      NODE_RPC_PASS: ${NODE_RPC_PASS}
      
      # Wallet RPC (EVM) - for payouts
      WALLET_RPC_URL: ${WALLET_RPC_URL}
      
      # Database - connects to pool-db container
      PG_URL: ${PG_URL:-postgres://test:test@pool-db:5432/pool}
      
      # IPFS - connects to ipfs container
      IPFS_NODE_URL: ${IPFS_NODE_URL:-http://ipfs:5001}
      
      # PPLNS Configuration
      PPLNS_N_WORK: ${PPLNS_N_WORK:-1000}
      
      # Maturity Configuration
      POOL_BLOCK_MATURITY: ${POOL_BLOCK_MATURITY:-10}
      POOL_PAYOUT_MATURITY: ${POOL_PAYOUT_MATURITY:-50}
      POOL_FEE_PERCENTAGE: ${POOL_FEE_PERCENTAGE:-2.0}
      
      POOL_PRIVATE_KEY: ${POOL_PRIVATE_KEY:-}
      TZ: Asia/Kolkata
      LOG_ROTATION_INTERVAL: ${LOG_ROTATION_INTERVAL:-1h}

    depends_on:
      pool-db:
        condition: service_healthy
      ipfs:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pool-db:
    image: postgres:15-alpine
    container_name: pool-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-test}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-test}
      POSTGRES_DB: ${PG_DB:-pool}
      TZ: Asia/Kolkata
    volumes:
      - ./db_data:/var/lib/postgresql/data  # Data saved to local 'db_data' folder
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-test} -d ${PG_DB:-pool}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ipfs:
    image: ipfs/kubo:latest
    container_name: ipfs
    restart: unless-stopped
    command: ["daemon", "--migrate=true", "--enable-pubsub-experiment"]
    volumes:
      - ./ipfs_export:/export               # Logs saved to local 'ipfs_export' folder
      - ./ipfs_data:/data/ipfs              # Config saved to local 'ipfs_data' folder
    ports:
      - "4001:4001"
      - "4001:4001/udp"

  adminer:
    image: adminer
    container_name: pool-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
